[project]
name = "ajantrik"
version = "0.1.0"
description = "Ajantrik, a configurable software factory: one factory.yaml, editable agents, skills and loop, run through Claude Code, Codex or any LLM API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Direct LLM API runtime (Anthropic, OpenAI, Bedrock, Ollama, LiteLLM proxy). Pinned below the
# releases that were pulled after the March 2026 PyPI compromise.
api = ["litellm>=1.80,!=1.82.7,!=1.82.8,<1.106"]
keyring = ["keyring>=25"]

[project.scripts]
factory = "ajantrik.kit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ajantrik"]

[tool.hatch.build.targets.wheel.force-include]
"presets" = "ajantrik/_data/presets"
"library" = "ajantrik/_data/library"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "SIM108", "E501"]

[tool.ruff.lint.per-file-ignores]
# Lifted verbatim from the hand-built factories (and copied into every repo); kept close to upstream.
"ajantrik/core/security/**" = ["SIM102", "E731", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["ajantrik"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["ajantrik/core/security/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests", "ajantrik/core/security/tests"]
addopts = "-q"
markers = ["live: needs a real model, CLI or network (opt-in: -m live)"]
