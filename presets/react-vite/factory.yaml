version: 2
repo:
  name: accounts-portal
  title: Accounts Portal Software Factory
  default_base: develop
  worktree_root: ../{repo}-factory
  context_files:
  - CLAUDE.md
runtime:
  kind: claude-code
  default_model: sonnet
loop:
  max_rounds: 3
  stages:
  - id: spec
    kind: agent
    title: Spec
    phase: plan
    agent: spec-writer
    output: spec.md
    rerun_on_rework: scope
  - id: design
    kind: agent
    title: Design
    phase: plan
    agent: architect
    output: design.md
    read_builders: true
    rerun_on_rework: always
  - id: approval
    kind: approval
    title: Approve
    note: approve the spec, design and mockup shots
  - id: tests
    kind: agent
    title: Tests
    phase: build
    next:
    - data
    - ui
    agent: test-author
    output: tests.md
  - id: data
    kind: agent
    title: data
    phase: build
    role: builder
    next: gate
    area_globs:
    - src/contexts/
    - src/utils/
    - src/types/
    - src/redux/
    - src/auth/
    - src/navigation/
    - src/instrumentation/
    - .env.example
    - '*.config.*'
    - tsconfig*.json
    description: contexts, hooks, utils, types, redux, auth, navigation, instrumentation and config
  - id: ui
    kind: agent
    title: ui
    phase: build
    role: builder
    area_globs:
    - src/pages/
    - src/components/
    - src/layouts/
    - src/drawer/
    - src/theme/
    - src/assets/
    - cypress/
    description: pages, components, layouts, drawer, theme, assets and Cypress specs
  - id: gate
    kind: gate
    title: Guardrails
    phase: guardrails
    next:
    - code
    - security
    - billing
    - platform
    - review-ui
    - ux
    on_fail: data
  - id: code
    kind: agent
    title: code
    phase: review
    role: reviewer
    next: integrate
    on_fail: data
  - id: security
    kind: agent
    title: security
    phase: review
    role: reviewer
    next: integrate
    on_fail: data
  - id: billing
    kind: agent
    title: billing
    phase: review
    role: reviewer
    next: integrate
    on_fail: data
    chip: bill
    path_globs:
    - src/pages/subscription/
    - src/pages/billing/
    - src/pages/plans/
    - src/components/credit-bar/
    - src/redux/
    - src/pages/dashboard/*Billing*
    - src/pages/dashboard/*Seat*
    - src/pages/dashboard/*Credit*
    - src/pages/dashboard/*Member*
    - src/pages/dashboard/*Invoice*
    - src/components/UpgradeModal*
    - src/components/BookingModal*
    - src/utils/stripeClient.ts
    - src/utils/gtmEvents.ts
    - src/utils/currentBillingPeriodFromProducts.ts
    - src/utils/service.ts
    - src/types/subscription.ts
    diff_patterns:
    - (?i)stripe|checkout|price|credit|seat|currency|invoice|unit_amount
  - id: platform
    kind: agent
    title: platform
    phase: review
    role: reviewer
    next: integrate
    on_fail: data
    chip: plat
    path_globs:
    - vite.config.ts
    - amplify.yml
    - customHttp.yml
    - package.json
    - package-lock.json
    - tsconfig*.json
    - .eslintrc*
    - index.html
    - vitest.setup.ts
    - cypress.config.ts
    - ecosystem.config.cjs
    - .env.example
    - .github/
    - src/App.tsx
    - src/instrumentation/
    - src/utils/configurations.ts
    diff_patterns:
    - import\.meta\.env|posthog|datadogRum|TagManager
    - https://
    builder: data
  - id: review-ui
    kind: agent
    title: ui
    phase: review
    next: integrate
    agent: reviewer-ui
    on_fail: data
    chip: ui
    path_globs:
    - src/pages/*.tsx
    - src/components/*.tsx
    - src/layouts/*.tsx
    - src/drawer/*.tsx
    - src/theme/*.tsx
    - src/assets/*.tsx
    - src/navigation/Router.tsx
    exclude_globs:
    - __test__/
    - __tests__/
    builder: ui
  - id: ux
    kind: agent
    title: ux
    phase: review
    role: reviewer
    on_fail: data
    path_globs:
    - src/pages/*.tsx
    - src/components/*.tsx
    - src/layouts/*.tsx
    - src/drawer/*.tsx
    - src/theme/*.tsx
    - src/assets/*.tsx
    - src/navigation/Router.tsx
    exclude_globs:
    - __test__/
    - __tests__/
    builder: ui
  - id: integrate
    kind: agent
    title: Integrate
    phase: integrate
    agent: integrator
gate:
  timeout_min: 10
  setup:
  - test: test -d node_modules
    error: node_modules missing in the worktree; run npm ci --prefix "$WORKTREE"
  - test: test -e .env
    error: .env missing in the worktree; link the main checkout's .env into it
  steps:
  - key: typecheck
    chip: tsc
    cmd: npx --no-install tsc --noEmit
  - key: lint
    chip: lint
    cmd: |
      # Many files already carry eslint errors; the ratchet fails only when a rule's count goes up.
      mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$MERGE_BASE" HEAD -- '*.ts' '*.tsx' '*.cjs' '*.mjs')
      if [[ ${#FILES[@]} -eq 0 ]]; then echo "lint: no changed ts/tsx files"; exit 0; fi
      node "$FACTORY_DIR/harness/lint-ratchet.mjs" "$MERGE_BASE" "${FILES[@]}"
  - key: tests
    chip: test
    cmd: |
      # autoUpdate is off so coverage can't rewrite vite.config.ts; the thresholds are still enforced.
      CI=true npx --no-install vitest run --coverage --testTimeout="${FACTORY_TEST_TIMEOUT:-20000}" \
        --coverage.thresholds.autoUpdate=false \
        --coverage.reportsDirectory="$OUT/coverage" \
        --coverage.reporter=json-summary --coverage.reporter=text-summary \
        --reporter=default --reporter=junit --outputFile.junit="$OUT/junit.xml"
    junit: junit.xml
    coverage:
      json_summary: coverage/coverage-summary.json
  - key: build
    chip: build
    cmd: |
      rm -rf "$OUT/dist"
      npx --no-install vite build --outDir "$OUT/dist" --emptyOutDir || exit 1
      printf '{"dist_kb": %s}\n' "$(du -sk "$OUT/dist" | cut -f1)" >"$OUT/build-metrics.json"
    metrics_file: build-metrics.json
  - key: e2e
    chip: e2e
    requires:
    - build
    lock: true
    external_failure: needs-human
    timeout_min: 10
    cmd: |
      PORT="${FACTORY_APP_PORT:-5173}"
      mkdir -p "$OUT/e2e"
      npx --no-install vite preview --outDir "$OUT/dist" --port "$PORT" --strictPort --host localhost >"$OUT/e2e/preview.log" 2>&1 &
      PREVIEW=$!
      trap 'kill $PREVIEW 2>/dev/null; wait $PREVIEW 2>/dev/null' EXIT
      for _ in $(seq 1 60); do
        curl -fsS --max-time 2 "http://localhost:$PORT/" >/dev/null 2>&1 && break
        sleep 0.5
      done
      npx --no-install cypress run --browser electron \
        --config "baseUrl=http://localhost:$PORT,videosFolder=$OUT/e2e/videos,screenshotsFolder=$OUT/e2e/screenshots,downloadsFolder=$OUT/e2e/downloads"
    builder: ui
  secrets: true
  clean_tree: true
preflight:
- cmd: node -e 'const [a,b,c]=process.versions.node.split(".").map(Number); process.exit(a>20||(a===20&&(b>12||(b===12&&c>=2)))?0:1)'
  hint: Node v20.12.2 or later is required.
- cmd: command -v "${FACTORY_CHROME:-google-chrome}"
  hint: Install Google Chrome or set FACTORY_CHROME to a Chrome binary (the harness uses the system browser).
- cmd: python3 .factory/security/policy.py check-env --require VITE_E2E_PASSWORD --match VITE_AUTH0_DOMAIN,VITE_BILLING_BASE_URL,VITE_ACCOUNTS_BASE_URL
    --pattern "${FACTORY_STAGING_PATTERN:-platform-test|staging}"
  hint: .env must define VITE_E2E_PASSWORD and point Auth0, billing and accounts at staging. Never run a job against
    production.
- cmd: test -d .factory/harness/node_modules/playwright-core
  hint: Run `npm ci --prefix .factory/harness` once.
- cmd: npx --no-install cypress verify
  hint: The Cypress binary is not installed; run `npx cypress install` once.
worktree:
- kind: run
  cmd: npm ci --no-audit --no-fund
- kind: symlink
  path: .env
conventions:
  branch: '{type}/{key}_{words}'
  branch_no_ticket: '{type}/{num}_{words}'
  branch_types:
    Bug: bugfix
    default: feature
  commit: '<feat|fix>: <KEY> - <what>'
  pr_template: .github/pull_request_template.md
connections:
  git:
    provider: github
    remote: origin
  tickets:
    provider: jira
    mode: mcp
    site: https://moveai.atlassian.net
    project: IST
    label: factory
    epic_branch_glob: '*{epic}[_-]*'
    no_epic_branch: fallback
    write_back: draft
delivery:
  mode: none
  require_approval: true
security:
  refuse_paths:
  - .claude/
  - .factory/
  - .npmrc
  - .github/workflows/
  outgoing_files:
  - pr.md
  - pr-title.txt
  - decision.md
  - jira-comment.md
  guard:
    env_reader_scripts: gate.sh, with-app.sh, Cypress
    local_url_example: http://localhost:5173/
    external_services: Jira, Notion and Figma
  refuse_patterns:
  - paths:
    - package.json
    pattern: '"(preinstall|install|postinstall|prepare)"\s*:'
ui:
  port: 8000
  job_files:
  - spec.md
  - design.md
  - shots/
  - tests.md
  - build-data.md
  - build-ui.md
  - decision.md
  - pr-title.txt
  - pr.md
  - jira-comment.md
  skip_dirs:
  - ui-scratch
  - ux-scratch
  - mockup
  - build-ui
  - coverage
  - e2e
  - harness-base
