version: 1
repo:
  name: mocap-desktop-gui
  title: Genesis Post Software Factory
  default_base: unstable
  worktree_root: ../{repo}-factory
  context_files:
  - CLAUDE.md
runtime:
  kind: claude-code
  default_model: sonnet
loop:
  max_rounds: 3
  stages:
  - id: spec
    kind: agent
    title: Spec
    agent: spec-writer
    output: spec.md
    rerun_on_rework: scope
  - id: design
    kind: agent
    title: Design
    agent: architect
    output: design.md
    read_builders: true
    rerun_on_rework: always
  - id: approval
    kind: approval
    title: Approve
    note: approve the spec and design
  - id: tests
    kind: agent
    title: Tests
    agent: test-author
    output: tests.md
  - id: build
    kind: builders
    title: Build
  - id: gate
    kind: gate
    title: Gate
  - id: review
    kind: reviewers
    title: Review
  - id: integrate
    kind: integrate
    title: Integrate
    agent: integrator
  - id: deliver
    kind: delivery
    title: Deliver
builders:
- id: py
  agent: builder-py
  description: Python side (models, controllers, workers, Qt properties/signals/slots, tests)
  area_globs:
  - mocap_desktop_gui/
  - tests/
- id: qml
  agent: builder-qml
  description: QML side (views, components, icons, the qrc and the generated rc_*.py)
  area_globs:
  - pyside_rc/
  - mocap_desktop_gui/gen/
  - '*.qrc'
reviewers:
  always:
  - id: code
  - id: security
    chip: sec
  routed:
  - id: calib
    builder: py
    path_globs:
    - mc_calib*
    - mc_*migration*
    - mc_intrinsic*
    - mc_extrinsic*
    - mc_global_*
    - mc_project_calib*
    - mc_project_data*
    - mc_project_settings*
    - mc_actor_profile*
    - mc_camera_profile*
    - mc_default_camera_profiles*
    - mc_common_paths*
    - mc_pending_project_changes*
    - mc_take_settings*
    - mc_take_run_settings*
    - mc_process_intrinsic_calib*
    - step1_intrinsics*
    - mc/settings/
  - id: xplat
    builder: py
    path_globs:
    - mc_update_manager*
    - mc_common_paths*
    - mc_file_util*
    - gpu_info*
    - mc_task_trt_engine_gen*
    - mc_offline_license*
    - mc_auth_core*
    - main.py
    - '*.spec'
    - hook-*.py
    - CMakeLists.txt
    - move.iss
    - linux/
    - pyproject.toml
    - poetry.lock
    diff_patterns:
    - subprocess
    - QProcess
    - os\.system
    - sys\.platform
    - platform\.system
    - os\.sep
    - expanduser
    - shutil\.
    - '["''][^"'']*(/home|C:\\\\|~/)'
  - id: ui
    builder: qml
    path_globs:
    - pyside_rc/qml/
    - pyside_rc/icons/
    - '*.qrc'
    scoped_patterns:
    - paths:
      - mocap_desktop_gui/
      pattern: '@Property|Signal\(|@Slot'
  - id: ux
    path_globs:
    - pyside_rc/qml/
    - pyside_rc/icons/
    - '*.qrc'
    scoped_patterns:
    - paths:
      - mocap_desktop_gui/
      pattern: '@Property|Signal\(|@Slot'
    builder: qml
gate:
  timeout_min: 20
  setup:
  - test: test -x "${FACTORY_VENV:-$HOME/.virtualenvs/mocap-desktop-gui}/bin/python"
    error: venv python not found. Set FACTORY_VENV to the project's virtualenv.
  - test: test -x "${FACTORY_VENV:-$HOME/.virtualenvs/mocap-desktop-gui}/bin/pre-commit"
    error: pre-commit not found in the venv. Set FACTORY_VENV to the project's virtualenv.
  steps:
  - key: lint
    chip: lint
    cmd: |
      VENV="${FACTORY_VENV:-$HOME/.virtualenvs/mocap-desktop-gui}"
      PATH="$VENV/bin:$PATH" "$VENV/bin/pre-commit" run --from-ref "$MERGE_BASE" --to-ref HEAD --show-diff-on-failure
    builder: py
  - key: tests
    chip: test
    cmd: |
      VENV="${FACTORY_VENV:-$HOME/.virtualenvs/mocap-desktop-gui}"
      # Replace the repo addopts so html/xml reports land in $OUT, not in the worktree.
      PYTHONPATH="$WORKTREE${PYTHONPATH:+:$PYTHONPATH}" QT_QPA_PLATFORM=offscreen \
        "$VENV/bin/python" -m pytest -o addopts="" -q --tb=short -p no:cacheprovider \
        --randomly-seed=3694812 --cov=mocap_desktop_gui --cov-report="xml:$OUT/coverage.xml" \
        --junitxml="$OUT/junit.xml"
    junit: junit.xml
    coverage:
      cobertura: coverage.xml
    builder: py
  secrets: true
  clean_tree: true
preflight:
- cmd: '"${FACTORY_VENV:-$HOME/.virtualenvs/mocap-desktop-gui}/bin/python" -c "import PySide6, mocap_settings"'
  hint: The shared venv must run the app and the tests. Set FACTORY_VENV, or create ~/.virtualenvs/mocap-desktop-gui
    with `poetry install`. The factory never installs dependencies.
worktree: []
conventions:
  branch: '{type}/{key}_{words}'
  branch_no_ticket: '{type}/{num}_{words}'
  branch_types:
    Bug: bugfix
    default: feature
  commit: '<feat|fix>: <KEY> - <what>'
  pr_template: .github/pull_request_template.md
connections:
  git:
    provider: github
    remote: origin
  tickets:
    provider: jira
    mode: mcp
    site: https://moveai.atlassian.net
    project: GEN
    label: factory
    epic_branch_glob: '*{epic}_*'
    no_epic_branch: block
    write_back: draft
delivery:
  mode: none
  require_approval: true
security:
  refuse_paths:
  - .claude/
  - .factory/
  - .github/workflows/
  - .pre-commit-config.yaml
  - pyproject.toml
  - poetry.lock
  - '*.spec'
  - hook-*.py
  outgoing_files:
  - pr.md
  - pr-title.txt
  - decision.md
  - jira-comment.md
  guard:
    env_reader_scripts: gate.sh and the app itself
    local_url_example: http://127.0.0.1:8000/
    external_services: Jira, Notion and Figma
ui:
  port: 8000
  build_label: py ∥ qml
  job_files:
  - spec.md
  - design.md
  - shots/
  - tests.md
  - build-py.md
  - build-qml.md
  - decision.md
  - pr-title.txt
  - pr.md
  - jira-comment.md
  skip_dirs:
  - ui-home
  - ui-scratch
  - ux-scratch
  - mockup
  - calib-scratch
  - build-qml
  - htmlcov
